<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="頭頂コンディション">
  <title>頭頂コンディション</title>
  <defs>
    <linearGradient id="sc-bg" x1="8" y1="0" x2="26" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e335f"/>
      <stop offset="0.48" stop-color="#3458b0"/>
      <stop offset="1" stop-color="#2795a9"/>
    </linearGradient>
    <linearGradient id="sc-stroke" x1="16" y1="7" x2="16" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fafefe"/>
      <stop offset="1" stop-color="#9aebef"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#sc-bg)"/>
  <!-- 頭頂〜前頭部の主弧 -->
  <path
    fill="none"
    stroke="url(#sc-stroke)"
    stroke-width="2.35"
    stroke-linecap="round"
    d="M7.25 18.75Q16 6.5 24.75 18.75"
  />
  <!-- テクスチャ（髪のレイヤー感） -->
  <path
    fill="none"
    stroke="#c9fcfa"
    stroke-width="1.65"
    stroke-linecap="round"
    opacity="0.9"
    d="M9.25 13.75Q16 9.75 22.75 13.75"
  />
  <path
    fill="none"
    stroke="#8ee8ef"
    stroke-width="1.35"
    stroke-linecap="round"
    opacity="0.78"
    d="M11 10.5Q16 7.85 21 10.5"
  />
  <!-- 解析フォーカス -->
  <circle cx="16" cy="21.2" r="2.45" fill="#6ef2f0" opacity="0.96"/>
  <circle cx="15.05" cy="20.35" r="0.7" fill="#fff" opacity="0.42"/>
</svg>
