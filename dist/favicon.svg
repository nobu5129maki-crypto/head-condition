<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="頭頂の質感から％へ換算した見ため指標を表示">
  <title>質感インデックス</title>
  <defs>
    <linearGradient id="fc-bg" x1="8" y1="0" x2="26" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e335f"/>
      <stop offset="0.5" stop-color="#3458b0"/>
      <stop offset="1" stop-color="#2795a9"/>
    </linearGradient>
    <linearGradient id="fc-scan" x1="9" y1="11" x2="23" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cffffd" stop-opacity="0.45"/>
      <stop stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fc-meter" x1="7.5" y1="23" x2="18" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ef9f1"/>
      <stop offset="1" stop-color="#3a9dbf"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#fc-bg)"/>

  <!-- 読み取り対象となる頭頂シルエット -->
  <path
    fill="none"
    stroke="#f2feff"
    stroke-width="2.2"
    stroke-linecap="round"
    d="M7.2 17.45Q16 7 24.85 17.45"
  />
  <!-- スキャン（横方向の質感チェック／解析） -->
  <path
    d="M10 11.5h12M10.6 13.75h11M11.35 15.95h10.3"
    fill="none"
    stroke="#9efbf4"
    stroke-width="1.05"
    stroke-linecap="round"
    opacity="0.5"
  />
  <ellipse cx="16" cy="14.15" rx="9.5" ry="4.95" fill="url(#fc-scan)" opacity="0.55"/>

  <!-- ％読みゲージ本体 -->
  <rect x="6.95" y="22.82" width="18.08" height="5.62" rx="2.76" fill="#081124" opacity="0.42"/>
  <rect x="7.28" y="23.26" width="17.42" height="4.74" rx="2.37" fill="none" stroke="#eafefe" stroke-width="1.1" opacity="0.75"/>
  <rect x="7.45" y="23.43" width="11.62" height="4.42" rx="2.08" fill="url(#fc-meter)" opacity="0.95"/>
  <path stroke="#dbf8fb" stroke-width="1.02" stroke-linecap="round" d="M10.9 26.92v1.35M13.95 26.92v1.35M17 26.92v1.35M20.08 26.92v1.35"/>

  <!-- メーターを指す針 -->
  <path fill="#fcf6ff" d="M16 18l-1 9.76h2z"/>
  <circle cx="16" cy="17.8" r="1.72" fill="#fcf6ff"/>

  <!-- ％（メータ読みとの対応関係が一目でわかる） -->
  <circle cx="26.72" cy="9.92" r="1.62" stroke="#f9feff" stroke-width="1.12" fill="none" opacity="0.9"/>
  <circle cx="28.52" cy="11.92" r="1.62" stroke="#f9feff" stroke-width="1.12" fill="none" opacity="0.9"/>
  <path d="M25.92 13.92l5.92-9.25" stroke="#f9feff" stroke-width="1.22" stroke-linecap="round" opacity="0.92"/>
</svg>
